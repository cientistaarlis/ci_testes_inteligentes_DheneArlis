[pytest]
# Onde o pytest vai procurar os testes
testpaths = tests

# Opções padrão para toda execução:
# --headed          = abre o browser visível (remova para rodar headless no CI)
# --screenshot=only-on-failure = tira screenshot só quando falha
# --html=report.html = gera relatório HTML
addopts = --screenshot=only-on-failure --output=test-results

# Marca customizada para identificar os tipos de teste
markers =
    manual: Testes escritos manualmente sem auxílio de IA
    ai: Testes gerados ou aprimorados com auxílio de IA
